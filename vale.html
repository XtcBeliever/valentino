<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
</head>
<body style="text-align: center; background-color: pink; font-family: Arial, sans-serif;">

    <h1 style="color: red;">Will You Be My Valentine?</h1>
    <p style="font-size: 20px; color: white;">
      I love you loads cuddie and I really can’t imagine a day without you. Be mine this Valentine’s Day and always!
    </p>

    <div style="font-size: 50px;">❤️</div>

    <button onclick="window.location.href='yes.html'" 
        style="background-color: red; color: white; padding: 10px 20px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; margin: 10px;">
        Yes, I Will!
    </button>

    <button onclick="window.location.href='no.html'" 
        style="background-color: black; color: white; padding: 10px 20px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; margin: 10px;">
        No, I Won’t!
    </button>
